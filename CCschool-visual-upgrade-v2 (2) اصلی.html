<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>رشد | سامانه یکپارچه مدیریت مدرسه</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap");
      /* ====== CCschool SPA — design tokens (Figma "رشد"): light + dark ====== */
      @font-face {
        font-family: "Vazirmatn";
        src: local("Vazirmatn"), local("Vazirmatn Regular"),
          url("fonts/Vazirmatn-variable.woff2") format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }
      :root {
        --bg: #f6f7f9;
        --surface: #ffffff;
        --soft: #f0f2f5;
        --border: #e3e7ed;
        --text: #182235;
        --muted: #667085;
        --primary: #4169e8;
        --primary-fg: #fff;
        --ptext: #4169e8;
        --tint: #edf1ff;
        --purple: #8b5cf6;
        --green: #15966b;
        --green-bg: #e6f7ef;
        --orange: #d97706;
        --orange-bg: #fff2df;
        --red: #dc4c64;
        --red-bg: #ffedf0;
        --yellow: #e8ad20;
        --orange2: #f28b32;
        --mint: #18a982;
        --nav: #172033;
        --navtext: #d2d9e5;
        --navhover: #253149;
        --overlay: rgb(10 16 30/0.58);
        --shadow: 0 2px 5px rgb(16 24 40/0.06), 0 10px 28px rgb(16 24 40/0.09);
        --r: 18px;
        --rc: 12px;
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        --bg: #10141c;
        --surface: #191f2a;
        --soft: #222a37;
        --border: #303a49;
        --text: #f2f4f7;
        --muted: #a1aab8;
        --primary: #4169e8;
        --ptext: #d0d7e2;
        --tint: #252e3d;
        --purple: #b69cff;
        --green: #39c995;
        --green-bg: #17372f;
        --orange: #ffb454;
        --orange-bg: #3c2d1b;
        --red: #ff8295;
        --red-bg: #3d2029;
        --nav: #0b1018;
        --navtext: #c4ccd8;
        --navhover: #1b2431;
        --overlay: rgb(0 0 0/0.72);
        --shadow: 0 2px 5px rgb(0 0 0/0.28), 0 12px 30px rgb(0 0 0/0.24);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        font-family: "Vazirmatn", Tahoma, "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.7;
        font-size: 14px;
      }
      h1,
      h2,
      h3,
      h4,
      p {
        margin: 0;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      a {
        color: var(--ptext);
        text-decoration: none;
      }
      :focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      .skip {
        position: absolute;
        inset-inline-start: 8px;
        top: -60px;
        z-index: 200;
        background: var(--primary);
        color: var(--primary-fg);
        padding: 8px 14px;
        border-radius: 10px;
      }
      .skip:focus {
        top: 8px;
      }
      .ltr {
        direction: ltr;
        unicode-bidi: isolate;
        display: inline-block;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12px;
      }
      .b {
        font-weight: 700;
      }
      svg.i {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      /* ====== App shell ====== */
      .app {
        display: flex;
        min-height: 100dvh;
      }
      .side {
        width: 256px;
        flex: none;
        background: var(--nav);
        color: var(--navtext);
        display: flex;
        flex-direction: column;
        position: sticky;
        top: 0;
        height: 100dvh;
        overflow-y: auto;
        z-index: 60;
      }
      .brand {
        padding: 28px 24px 8px;
      }
      .brand b {
        display: block;
        font-size: 30px;
        color: #fff;
        font-weight: 800;
        line-height: 1.2;
      }
      .brand span {
        font-size: 11px;
        opacity: 0.8;
      }
      .nav {
        padding: 20px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
      }
      .nav a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        border-radius: 12px;
        color: var(--navtext);
        font-size: 13px;
        min-height: 44px;
      }
      .nav a:hover {
        background: var(--navhover);
        color: #fff;
      }
      .nav a[aria-current="page"] {
        background: var(--primary);
        color: #fff;
        font-weight: 700;
      }
      .who {
        padding: 16px 24px 24px;
        font-size: 12px;
        border-top: 1px solid rgb(255 255 255/0.08);
      }
      .who b {
        display: block;
        color: #fff;
        font-weight: 600;
      }
      .who button {
        margin-top: 8px;
        background: none;
        border: 1px solid rgb(255 255 255/0.25);
        color: var(--navtext);
        border-radius: 8px;
        padding: 2px 10px;
        cursor: pointer;
        font-size: 12px;
      }
      .main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 32px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 40;
      }
      .top .school {
        margin-inline-end: auto;
      }
      .top .school b {
        display: block;
        font-size: 14px;
      }
      .top .school span {
        font-size: 11px;
        color: var(--muted);
      }
      .yearchip {
        background: var(--tint);
        color: var(--ptext);
        border-radius: 10px;
        padding: 6px 14px;
        font-size: 13px;
      }
      .icon-btn {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        border: 0;
        background: none;
        color: var(--muted);
        display: inline-grid;
        place-items: center;
        cursor: pointer;
        position: relative;
      }
      .icon-btn:hover {
        background: var(--soft);
        color: var(--text);
      }
      .dot {
        position: absolute;
        top: 6px;
        inset-inline-start: 6px;
        background: var(--red);
        color: #fff;
        border-radius: 99px;
        font-size: 10px;
        min-width: 16px;
        height: 16px;
        line-height: 16px;
        text-align: center;
      }
      .menu-btn {
        display: none;
      }
      .view {
        padding: 28px 32px 56px;
        max-width: 1180px;
        width: 100%;
        margin-inline: auto;
      }
      .scrim {
        display: none;
      }
      @media (max-width: 833px) {
        .menu-btn {
          display: inline-grid;
        }
        .side {
          position: fixed;
          inset-block: 0;
          inset-inline-start: 0;
          transform: translateX(100%);
          transition: transform 0.25s;
          box-shadow: 0 0 40px rgb(0 0 0/0.4);
        }
        .app.open .side {
          transform: none;
        }
        .app.open .scrim {
          display: block;
          position: fixed;
          inset: 0;
          background: var(--overlay);
          z-index: 50;
        }
        .top {
          padding: 10px 14px;
        }
        .view {
          padding: 20px 16px 48px;
        }
        .yearchip {
          display: none;
        }
      }
      /* ====== Components ====== */
      .ph {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 20px;
      }
      .ph h1 {
        font-size: 28px;
        font-weight: 800;
        line-height: 1.5;
        outline: none;
      }
      .ph p {
        color: var(--muted);
        font-size: 13px;
        margin-top: 2px;
      }
      @media (max-width: 640px) {
        .ph h1 {
          font-size: 22px;
        }
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r);
        padding: 20px;
        box-shadow: var(--shadow);
      }
      .card > h2,
      .card > .ct h2 {
        font-size: 18px;
        font-weight: 700;
      }
      .ct {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }
      .card h3 {
        font-size: 16px;
        font-weight: 700;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      .grow {
        flex: 1;
      }
      .g2,
      .g3,
      .g4 {
        display: grid;
        gap: 16px;
      }
      .g2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .g3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .g4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      @media (max-width: 1000px) {
        .g4 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .g3 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 700px) {
        .g2,
        .g3,
        .g4 {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 44px;
        padding: 0 20px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--ptext);
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        transition: background 0.15s, filter 0.15s;
      }
      .btn:hover {
        background: var(--soft);
      }
      .btn.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--primary-fg);
      }
      .btn.primary:hover {
        filter: brightness(1.1);
        background: var(--primary);
      }
      .btn.danger {
        background: var(--red);
        border-color: var(--red);
        color: #fff;
      }
      :root[data-theme="dark"] .btn.danger {
        color: #2a0c14;
      }
      .btn.danger:hover {
        filter: brightness(1.1);
        background: var(--red);
      }
      .btn.ghost {
        border-color: transparent;
        background: none;
      }
      .btn.ghost:hover {
        background: var(--tint);
      }
      .btn.sm {
        min-height: 36px;
        padding: 0 14px;
      }
      .btn[disabled],
      .btn.off {
        background: var(--soft);
        color: var(--muted);
        border-color: var(--soft);
        cursor: not-allowed;
        filter: none;
      }
      .btn.done {
        background: var(--primary);
        color: var(--primary-fg);
        border-color: var(--primary);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        white-space: nowrap;
        border-radius: 99px;
        padding: 1px 11px;
        font-size: 12px;
        font-weight: 500;
        background: var(--soft);
        color: var(--muted);
      }
      .badge.primary {
        background: var(--tint);
        color: var(--ptext);
      }
      .badge.ok {
        background: var(--green-bg);
        color: var(--green);
      }
      .badge.warn {
        background: var(--orange-bg);
        color: var(--orange);
      }
      .badge.err {
        background: var(--red-bg);
        color: var(--red);
      }
      .badge.purple {
        background: var(--tint);
        color: var(--purple);
      }
      .alert {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        border-radius: 12px;
        padding: 12px 16px;
        font-size: 13px;
        background: var(--tint);
        color: var(--ptext);
        line-height: 1.9;
      }
      .alert.ok {
        background: var(--green-bg);
        color: var(--green);
      }
      .alert.warn {
        background: var(--orange-bg);
        color: var(--orange);
      }
      .alert.err {
        background: var(--red-bg);
        color: var(--red);
      }
      .alert svg {
        margin-top: 5px;
        width: 16px;
        height: 16px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }
      .field > label,
      .lbl {
        font-size: 13px;
        font-weight: 500;
      }
      .req {
        color: var(--red);
      }
      .input,
      .select,
      .textarea {
        width: 100%;
        min-height: 44px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
        padding: 8px 14px;
        font-size: 14px;
      }
      .input::placeholder,
      .textarea::placeholder {
        color: var(--muted);
      }
      .input:focus,
      .select:focus,
      .textarea:focus {
        border-color: var(--primary);
        outline: 2px solid var(--primary);
        outline-offset: 0;
      }
      .input[aria-invalid="true"] {
        border-color: var(--red);
        background: var(--red-bg);
      }
      .input[readonly],
      .input:disabled {
        background: var(--soft);
        color: var(--muted);
      }
      .textarea {
        min-height: 110px;
        resize: vertical;
        line-height: 1.9;
      }
      .hint {
        font-size: 12px;
        color: var(--muted);
      }
      .err-t {
        font-size: 12px;
        color: var(--red);
      }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      .form-grid .full {
        grid-column: 1/-1;
      }
      @media (max-width: 700px) {
        .form-grid {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .fchip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 44px;
        padding: 0 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
        color: var(--ptext);
        font-size: 13px;
      }
      .fchip select,
      .fchip input {
        border: 0;
        background: none;
        color: var(--ptext);
        outline-offset: 6px;
        min-width: 0;
        cursor: pointer;
      }
      .fchip input {
        cursor: text;
        width: min(230px, 52vw);
      }
      .fchip select {
        max-width: 150px;
      }
      .fchip.search {
        flex: 0 1 280px;
      }
      .fchip.search input {
        width: 100%;
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 16px;
      }
      .tabs {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        background: var(--soft);
        padding: 6px;
        border-radius: 14px;
        margin-bottom: 18px;
        scrollbar-width: thin;
      }
      .tab {
        flex: none;
        min-height: 40px;
        padding: 0 16px;
        border-radius: 10px;
        border: 0;
        background: none;
        color: var(--ptext);
        cursor: pointer;
        font-size: 13px;
      }
      .tab:hover {
        background: var(--surface);
      }
      .tab[aria-selected="true"] {
        background: var(--primary);
        color: var(--primary-fg);
        font-weight: 600;
      }
      .tblwrap {
        overflow-x: auto;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface);
      }
      table.tbl {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        min-width: 520px;
      }
      .tbl th {
        background: var(--soft);
        color: var(--muted);
        font-weight: 600;
        font-size: 12px;
        text-align: start;
        padding: 12px 16px;
        white-space: nowrap;
      }
      .tbl td {
        padding: 12px 16px;
        border-top: 1px solid var(--border);
        vertical-align: middle;
      }
      .tbl tr:hover td {
        background: color-mix(in srgb, var(--soft) 45%, transparent);
      }
      .tbl .num {
        font-variant-numeric: tabular-nums;
      }
      .tbl td.empty {
        background: none;
        color: var(--muted);
      }
      .tbl a.lnk,
      .lnkbtn {
        background: none;
        border: 0;
        padding: 0;
        color: var(--ptext);
        cursor: pointer;
        font-size: 13px;
      }
      .tt th:first-child,
      .tt td:first-child {
        position: sticky;
        inset-inline-start: 0;
        background: var(--surface);
        font-weight: 600;
      }
      .tt th:first-child {
        background: var(--soft);
      }
      .tt td small {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      .tt td.off {
        color: var(--muted);
        background: color-mix(in srgb, var(--soft) 50%, var(--surface));
      }
      .tt td.hl {
        background: var(--tint);
      }
      .tt td.clash {
        background: var(--red-bg);
        outline: 1px solid var(--red);
        outline-offset: -1px;
      }
      @media (max-width: 640px) {
        table.tbl.stackm {
          min-width: 0;
        }
        .tbl.stackm thead {
          display: none;
        }
        .tbl.stackm tr {
          display: block;
          border-top: 1px solid var(--border);
          padding: 8px 4px;
        }
        .tbl.stackm td {
          display: flex;
          justify-content: space-between;
          gap: 12px;
          border: 0;
          padding: 6px 12px;
        }
        .tbl.stackm td::before {
          content: attr(data-label);
          color: var(--muted);
          font-size: 12px;
          flex: none;
        }
      }
      .stat {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .stat .l {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 13px;
      }
      .stat .l svg {
        color: var(--ptext);
      }
      .stat .v {
        font-size: 32px;
        font-weight: 800;
        line-height: 1.3;
      }
      .stat .n {
        font-size: 12px;
        color: var(--muted);
      }
      .hero {
        background: var(--tint);
        border-color: transparent;
        display: flex;
        align-items: center;
        gap: 24px;
        justify-content: space-between;
        flex-wrap: wrap;
      }
      .hero h2 {
        font-size: 22px;
        font-weight: 800;
        margin-bottom: 6px;
      }
      .hero p {
        color: var(--muted);
        margin-bottom: 10px;
      }
      .hero .acts {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .hero svg.char {
        width: 150px;
        height: auto;
        flex: none;
      }
      .list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
      }
      .list > li {
        padding: 12px 0;
        border-top: 1px solid var(--border);
      }
      .list > li:first-child {
        border: 0;
        padding-top: 0;
      }
      .item {
        display: flex;
        gap: 12px;
        justify-content: space-between;
        align-items: flex-start;
      }
      .item .t {
        font-weight: 600;
      }
      .item .m {
        font-size: 12px;
        color: var(--muted);
      }
      .bar {
        height: 10px;
        border-radius: 99px;
        background: var(--primary);
        min-width: 4px;
      }
      .barrow {
        display: grid;
        grid-template-columns: 44px 1fr 56px;
        gap: 10px;
        align-items: center;
        margin: 10px 0;
      }
      .modal {
        border: 0;
        border-radius: var(--r);
        background: var(--surface);
        color: var(--text);
        padding: 24px;
        width: min(92vw, 30rem);
        box-shadow: 0 20px 60px rgb(0 0 0/0.35);
      }
      .modal::backdrop {
        background: var(--overlay);
      }
      .modal h2 {
        font-size: 18px;
        margin-bottom: 10px;
      }
      .modal .acts {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        flex-wrap: wrap;
        margin-top: 18px;
      }
      #toasts {
        position: fixed;
        inset-inline-start: 16px;
        bottom: 16px;
        z-index: 300;
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-width: min(92vw, 420px);
      }
      .toast {
        background: var(--text);
        color: var(--bg);
        padding: 10px 16px;
        border-radius: 12px;
        box-shadow: var(--shadow);
        font-size: 13px;
        animation: in 0.2s;
      }
      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      .skel {
        height: 14px;
        border-radius: 8px;
        background: linear-gradient(

      /* ---- class workspace ---- */
      const wsHead = (cl, tab) =>
        `${pageHead(
          `${clsName(cl)} • کلاس ${fa(cl)}`,

          "ctab",

      ACT.ctab = (a) => go("/teacher/classes/" + a);
      const guardCls = (cl) =>
        tCls(cl)
          ? null
          : {
              title: "کلاس",
              html:
                pageHead(

      });
      function examsTab(cl) {
        const F = U("tex", { q: "", who: "", open: "" });
        const list = EXAMS.filter(
          (e) =>
            (e.cls === cl && !e.done) ||
            (e.cls === cl && e.done && mine(e) && false)

            (e) =>

        const open = EXAMS.find((e) => e.id === F.open);

            "",
            "texw",
            [

              ["me", "فقط خودم"],

  <div class="g2" style="align-items:start"><div class="stack">${

            "thwk",

  <div class="row" style="margin-bottom:14px"><a class="btn primary" href="#/teacher/classes/${cl}/homework/new">ایجاد تکلیف یا فعالیت</a></div>${alertBox(
            "تکالیف الزامی و فعالیت‌ها اختیاری‌اند. فقط مواردی که خودتان ساخته‌اید قابل ویرایش یا حذف هستند."

  <div class="g2" style="margin-top:16px">${

      /* ---- grade entry (0–20) ---- */
      const parseScore = (raw) => {
        const t = en(String(raw ?? "")).trim();
        if (t === "") return { s: "blank" };
        if (!/^\d+(\.\d+)?$/.test(t))
          return { s: "bad", msg: "مقدار عددی معتبر وارد کنید." };
        const v = Number(t);
        if (v < 0 || v > 20) return { s: "range" };
        if (!/^\d+(\.\d{1,2})?$/.test(t))
          return { s: "bad", msg: "حداکثر دو رقم اعشار مجاز است." };
        return { s: "ok", v };
      };
      const savedTxt = (ex, sid) =>
        SCORES[ex.id] && SCORES[ex.id][sid] != null
          ? String(SCORES[ex.id][sid])
          : "";
      function gradesTab(cl) {

          };
        const G = U("gd:" + cl, () => ({

          q: "",
          page: 1,
          dense: false,
          vals: {},
          init: null,
        }));
        const ex = exams.find((e) => e.id === G.ex) || exams[0];
        const rs = roster(cl);
        if (G.init !== ex.id) {
          G.init = ex.id;
          G.vals = {};
          rs.forEach((s) => (G.vals[s.id] = savedTxt(ex, s.id)));
          if (ex.id === "e5" && cl === "101") {
            const byName = (n) => rs.find((s) => s.name === n).id;
            Object.assign(G.vals, {
              [byName("پارسا کریمی")]: "۲۲",
              [byName("سامان حسینی")]: "۱۹",
              [byName("امیرعلی مرادی")]: "۱۶٫۷۵",
            });
          }
        }
        const info = (s) => {
          const p = parseScore(G.vals[s.id]);
          const dirty =
            (G.vals[s.id] ?? "").trim() !== savedTxt(ex, s.id).trim() &&
            !(
              p.s === "ok" &&
              savedTxt(ex, s.id) !== "" &&
              Number(savedTxt(ex, s.id)) === p.v
            );
          return { p, dirty };
        };
        const all = rs.map((s) => ({ s, ...info(s) }));
        const bad = all.filter((x) => x.p.s === "range" || x.p.s === "bad");
        const dirty = all.filter((x) => x.dirty);
        const shown = all.filter((x) => includesQ(x.s.name, G.q));
        const per = 6,
          pg = Math.min(G.page, Math.max(1, Math.ceil(shown.length / per)));
        const status = (x) =>
          x.p.s === "range"
            ? '<span style="color:var(--red)">خارج از بازه</span>'
            : x.p.s === "bad"
            ? '<span style="color:var(--red)">نامعتبر</span>'
            : x.p.s === "blank"
            ? x.dirty
              ? "ذخیره‌نشده (پاک‌شده)"
              : '<span class="muted">وارد نشده</span>'
            : x.dirty
            ? "ذخیره‌نشده"
            : '<span style="color:var(--green)">ذخیره‌شده</span>';
        const rows = shown
          .slice((pg - 1) * per, pg * per)
          .map(
            (x, i) =>
              `<tr><td data-label="ردیف">${fa(
                (pg - 1) * per + i + 1
              )}</td><th scope="row" data-label="دانش‌آموز" style="font-weight:600;text-align:start">${esc(
                x.s.name
              )}</th><td data-label="نمره از ۲۰"><input class="input gin" id="g-${
                x.s.id
              }" inputmode="decimal" dir="ltr" data-on="gin" data-sid="${

              }" value="${esc(
                G.vals[x.s.id] ?? ""

                G.vals[bad[0].s.id]
              )} را اصلاح کنید.${
                bad.length > 1 ? ` (${fa(bad.length - 1)} مورد دیگر)` : ""

            ).replace(
              '<div class="alert err"',
              '<div id="gerr" class="alert err"'

          : G.saved

            tCls(cl).subject
          )} • کلاس ${fa(cl)}</div></div>${field(
            "gex",
            "آزمون",
            sel(
              "gex",
              exams.map((e) => [e.id, e.title]),
              ex.id,
              { attr: 'data-on="gex"' }
            )
          )}<div class="field"><span class="lbl">تاریخ آزمون</span><div class="input" style="display:flex;align-items:center">${jdy(
            ex.date
          )}</div></div></div>
  <div class="filters" style="margin-top:14px">${fsearch(
    "gq",
    G.q,
    "جست‌وجوی دانش‌آموز",
    "gq"
  )}<div class="seg" role="group" aria-label="تراکم جدول"><button type="button" data-act="gdens" data-arg="0" aria-pressed="${!G.dense}">نمای راحت</button><button type="button" data-act="gdens" data-arg="1" aria-pressed="${
            G.dense
          }">نمای فشرده</button></div></div>
  ${alertBox(
    `نمره‌ها به دانش‌آموز، کلاس ${fa(cl)}، ${esc(ex.subject)}، ${esc(
      ex.title
    )} و تاریخ ${jd(ex.date)} پیوند می‌خورند. مقیاس نمره ۰ تا ۲۰ است.`
  )}
  <div style="margin-top:16px">${`<div class="tblwrap"><table class="tbl stackm ${

  <div class="stack" style="margin-top:14px">${msg}</div>${pager(

            "gpage"

            .replace("دانش‌آموز", "")
            .replace(/(نمایش [^<]*?)از (\S+)/, "$1از $2 دانش‌آموز")}
  <div class="row" style="margin-top:14px"><button class="btn primary" data-act="gsave" ${
    bad.length || !dirty.length ? "disabled" : ""
  }>ذخیره نمره‌ها</button><button class="btn" data-act="gcancel" ${
            dirty.length ? "" : "disabled"
          }>انصراف از تغییرات</button><span class="small muted">${
            dirty.length ? fa(dirty.length) + " تغییر ذخیره‌نشده" : ""
          }</span></div>`,
        };

          (x) => x.startsWith("gd:") && x === "gd:" + here().split("/")[3]
        );

        ui[k].init = null;
        ui[k].page = 1;
        ui[k].saved = false;
        render();
      };
      const gkey = () => "gd:" + here().split("/")[3];
      ON.gin = (v, el) => {
        const G = ui[gkey()];
        G.vals[el.dataset.sid] = v;
        G.saved = false;
        render();
      };
      ON.gq = (v) => {
        const G = ui[gkey()];
        G.q = v;
        G.page = 1;
        render();

      ACT.gsave = () => {

        Object.entries(G.vals).forEach(([sid, raw]) => {

        });
        G.init = null;
        G.saved = true;
        render();
        toast("نمره‌ها در این نمایش ذخیره شد.");
      };

      /* ---- exam / homework forms ---- */
      function fmtErr(list) {
        return list.map((e) => alertBox(esc(e), "err")).join("");
      }
      const clsSel = (id, cl) =>
        sel(
          id,

        );
      route("/teacher/classes/:cl/exams/new", "teacher", ({ cl }) =>

      );
      route("/teacher/classes/:cl/exams/:id/edit", "teacher", ({ cl, id }) => {
        const e = EXAMS.find((x) => x.id === id);
        if (!e || !mine(e))
          return {
            title: "دسترسی ندارید",

              pageHead("فقط ایجادکننده می‌تواند این آزمون را ویرایش کند") +
              `<a class="btn" href="#/teacher/classes/${cl}/exams">بازگشت</a>`,
          };
        return examForm(cl, e);

      function examForm(cl, e) {

        return {
          title: e ? "ویرایش آزمون" : "ایجاد آزمون",

            e ? "ویرایش آزمون" : "ایجاد آزمون",

          )}

  }" class="stack" style="margin-top:16px" novalidate><div class="card"><div class="form-grid">${field(
            "xs",
            "درس اختصاص‌یافته",
            inp("xs", c.subject, { ro: 1 })
          )}${field("xc", "کلاس مقصد", clsSel("xc", cl))}${field(
            "xt",
            "عنوان آزمون",
            inp("xt", e ? e.title : "", { attr: 'maxlength="80"' }),
            { full: 1, req: 1 }
          )}${field(
            "xn",
            "مباحث و توضیحات",
            txt("xn", e ? e.topics : "", { attr: 'style="min-height:70px"' }),
            { full: 1 }
          )}${field(
            "xd",
            "تاریخ آزمون",
            inp("xd", e ? jshort(e.date) : "", {
              ltr: 1,
              attr: 'inputmode="numeric" placeholder="۱۴۰۴/۰۹/۱۷"',
            }),
            { req: 1, hint: "تاریخ شمسی، مثلاً ۱۴۰۴/۰۹/۱۷" }
          )}${field(
            "xh",
            "ساعت شروع — اختیاری",

          if (!b.s || !b.e || b.e <= b.s)
            errs.push(`زنگ ${fa(i + 1)}: زمان پایان باید پس از شروع باشد.`);
          else if (i && d.bells[i - 1].e > b.s)
            errs.push(`زنگ ${fa(i + 1)} با زنگ قبل همپوشانی دارد.`);
        });
        if (errs.length) {
          S2.err = errs;
          render();
          return;
        }
        Object.assign(SCHOOL, {
          name: d.name.trim(),
          code: d.code.trim(),
          phone: d.phone,
          address: d.address,
          year: d.year.trim(),
        });
        DAYS.forEach((x, i) => (x.on = d.days[i]));
        BELLS.splice(
          0,
          BELLS.length,
          ...d.bells.map((b, i) => ({ n: i + 1, s: b.s, e: b.e }))
        );
        S2.err = [];
        toast("تنظیمات در این نمایش اعمال شد.");
        render();
      };
      route("/admin/settings/account", "admin", () => ({
        title: "حساب",
        html: settingsPage("admin"),
      }));

      /* ======================= boot ======================= */
      applyTheme();
      if (!location.hash) {
        history.replaceState(null, "", S.role ? "#/" + S.role : "#/login");
      }
      render();
    </script>
  </body>
</html>
